<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surrey 89ers — Season Schedule</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --green:#008348;--green-dark:#005c33;--green-deep:#003d22;--green-dim:rgba(0,131,72,0.15);
  --offwhite:#FAF9F6;--offwhite-mid:rgba(250,249,246,0.6);--muted:rgba(250,249,246,0.4);
  --card:#0f1f16;--card2:#152a1c;--border:rgba(0,131,72,0.2);--border-soft:rgba(250,249,246,0.07);
  --red:#e05555;--amber:#f59e0b;
}
body{font-family:"Inter",sans-serif;background:#080f0b;color:var(--offwhite);min-height:100vh;-webkit-font-smoothing:antialiased}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;
  border-bottom:1px solid var(--border-soft);position:sticky;top:0;background:rgba(8,15,11,.95);
  backdrop-filter:blur(10px);z-index:40}
.tb-l{display:flex;align-items:center;gap:11px}
.tb-logo{width:32px;height:32px;border-radius:50%;background:var(--green-deep);display:flex;
  align-items:center;justify-content:center;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:11px;color:#fff}
.tb-t{font-family:"Space Grotesk",sans-serif;font-size:14px;font-weight:700;line-height:1.2}
.tb-s{font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.back{background:var(--card);border:1px solid var(--border-soft);border-radius:7px;padding:7px 13px;
  font-size:12px;font-weight:600;color:var(--offwhite-mid);text-decoration:none;transition:.15s;white-space:nowrap}
.back:hover{color:var(--offwhite);border-color:var(--green)}

.wrap{max-width:1180px;margin:0 auto;padding:24px 22px 60px}
.h1{font-family:"Space Grotesk",sans-serif;font-size:26px;font-weight:700}
.h2{font-size:12.5px;color:var(--muted);margin-top:3px}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0 12px;flex-wrap:wrap}
.nav-grp{display:flex;align-items:center;gap:9px}
.nav-btn{background:var(--card);border:1px solid var(--border-soft);border-radius:6px;padding:6px 12px;
  font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:.15s;line-height:1.2}
.nav-btn:hover{color:var(--offwhite);border-color:var(--border)}
.month-label{font-family:"Space Grotesk",sans-serif;font-size:16px;font-weight:700;min-width:158px;text-align:center}
.today-btn{background:var(--green-dim);color:var(--green);border:1px solid rgba(0,131,72,0.3);
  border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}

.cat-filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.cat-pill{font-size:9.5px;font-weight:700;padding:4px 11px;border-radius:8px;cursor:pointer;
  letter-spacing:.5px;transition:opacity .15s;border:1px solid transparent;opacity:.45;text-transform:uppercase}
.cat-pill.on{opacity:1}

.wd-row{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px}
.wd{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);
  text-align:center;padding:6px 0}
.month-wrap{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.md{min-height:92px;background:var(--card);border:1px solid var(--border-soft);border-radius:6px;
  padding:5px;transition:border-color .15s;overflow:hidden}
.md.has:hover{border-color:var(--border);cursor:pointer}
.md.today{border-color:var(--green);background:rgba(0,131,72,0.04)}
.md.today .md-num{color:var(--green)}
.md.other{opacity:.28}
.md.sel{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
.md-num{font-family:"Space Grotesk",sans-serif;font-size:12px;font-weight:700;color:var(--offwhite-mid);margin-bottom:3px}
.mev{font-size:9.5px;font-weight:600;padding:3px 5px;border-radius:4px;margin-bottom:2px;
  border:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}

.detail{margin-top:16px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.detail-h{font-family:"Space Grotesk",sans-serif;font-size:14px;font-weight:700;margin-bottom:10px}
.d-ev{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-soft)}
.d-ev:last-child{border-bottom:0}
.d-time{width:56px;flex-shrink:0;font-size:12px;font-weight:600;color:var(--offwhite-mid);
  font-variant-numeric:tabular-nums;padding-top:1px}
.d-body{flex:1;min-width:0}
.d-title{font-size:13.5px;font-weight:600}
.d-meta{font-size:11.5px;color:var(--muted);display:flex;gap:11px;flex-wrap:wrap;margin-top:2px}
.d-tag{font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:2px 6px;
  border-radius:4px;border:1px solid transparent;margin-left:8px;vertical-align:1px}

.note{background:var(--card);border:1px dashed var(--border);border-radius:10px;padding:26px;
  text-align:center;color:var(--muted);font-size:13px;line-height:1.7;margin-top:20px}
.loading{text-align:center;color:var(--muted);font-size:13px;padding:56px 0}

@media(max-width:720px){
  .wrap{padding:18px 12px 50px}
  .md{min-height:62px;padding:3px}
  .md-num{font-size:11px}
  .mev{font-size:0;padding:0;height:5px;border-radius:3px;margin-bottom:3px}
  .month-label{min-width:120px;font-size:14px}
  .h1{font-size:21px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-l">
    <div class="tb-logo">89</div>
    <div><div class="tb-t">Surrey 89ers</div><div class="tb-s" id="tb-season">Schedule</div></div>
  </div>
  <a class="back" id="back" href="/">&larr; Back</a>
</div>

<div class="wrap">
  <div class="h1">Season Schedule</div>
  <div class="h2" id="sub">Loading…</div>

  <div class="toolbar">
    <div class="nav-grp">
      <button class="nav-btn" onclick="shiftMonth(-1)" aria-label="Previous month">&larr;</button>
      <div class="month-label" id="month-label"></div>
      <button class="nav-btn" onclick="shiftMonth(1)" aria-label="Next month">&rarr;</button>
    </div>
    <button class="today-btn" onclick="goToday()">Today</button>
  </div>

  <div class="cat-filters" id="cat-filters"></div>
  <div id="grid"><div class="loading">Loading the schedule…</div></div>
  <div id="detail"></div>
</div>

<script>
const SEASON="2026-27";
/* ============================================================
   SHARED SCHEDULE READER
   Reads the master schedule and keeps only what players may see.
   The rule: visibility must say "Both" or "Players". Anything else
   — "Coaches Only", or blank — stays out. Blank is treated as
   hidden on purpose: a forgotten tag should fail closed, not leak.
   ============================================================ */
const SCHEDULE_CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vTxFit7jrGqaHcbBTuK15aBvfn4AVsd5MWK4tMLgDyoQdCJSHvQM7F4cRFK-3w91n65RlfMlNISYFD8/pub?gid=0&single=true&output=csv";

function schedClean(s){return(s||"").replace(/^"|"$/g,"").replace(/\r/g,"").trim();}
function schedParseCSV(text){
  return text.replace(/\r/g,"").trim().split("\n").map(line=>{
    const c=[];let cur="",q=false;
    for(const ch of line){
      if(ch==='"')q=!q;
      else if(ch===","&&!q){c.push(schedClean(cur));cur="";}
      else cur+=ch;
    }
    c.push(schedClean(cur));return c;
  });
}
/* dates in the sheet are dd/mm/yyyy */
function schedDate(s){
  const p=String(s).split("/");
  if(p.length!==3) return null;
  const d=new Date(+p[2],+p[1]-1,+p[0]);
  return isNaN(d.getTime())?null:d;
}
function schedISO(d){const z=n=>(n<10?"0":"")+n;return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());}
function schedToday(){const d=new Date();d.setHours(0,0,0,0);return d;}

/* Monday-start week containing `d` */
function weekStart(d){
  const x=new Date(d); x.setHours(0,0,0,0);
  const day=(x.getDay()+6)%7;          /* Mon=0 … Sun=6 */
  x.setDate(x.getDate()-day); return x;
}

function playerVisible(v){ return /^(both|players)$/i.test(v||""); }

async function loadSchedule(){
  try{
    const res=await fetch(SCHEDULE_CSV+"&cachebust="+Date.now());
    if(!res.ok) throw new Error("schedule http "+res.status);
    const rows=schedParseCSV(await res.text());
    if(rows.length<2) return [];
    const head=rows[0].map(h=>h.toLowerCase().replace(/[^a-z_]/g,""));
    const at=n=>head.indexOf(n);
    /* header names keep their underscores after cleaning, so match them exactly */
    const iDate=at("date"), iStart=at("start_time"), iEnd=at("end_time"),
          iAll=at("all_day"), iCat=at("category"), iTitle=at("title"),
          iNotes=at("notes"), iLoc=at("location"), iVis=at("visibility");

    const iMulti=at("multi_day_end");
    const out=[];
    rows.slice(1).forEach(r=>{
      const d=schedDate(r[iDate]);
      if(!d || !schedClean(r[iTitle])) return;
      if(!playerVisible(r[iVis])) return;
      const base={
        start: iStart>=0?r[iStart]:"", end: iEnd>=0?r[iEnd]:"",
        allDay: iAll>=0 && String(r[iAll]).toUpperCase()==="TRUE",
        cat: iCat>=0?(r[iCat]||""):"", title:r[iTitle],
        notes: iNotes>=0?(r[iNotes]||""):"", loc: iLoc>=0?(r[iLoc]||""):""
      };
      /* a multi-day entry gets one copy per day it covers, so it shows
         on every day of the trip rather than only the first */
      const endD = iMulti>=0 ? schedDate(r[iMulti]) : null;
      const lastD = (endD && endD>d) ? endD : d;
      for(let c=new Date(d); c<=lastD; c.setDate(c.getDate()+1)){
        const day=new Date(c);
        out.push(Object.assign({}, base, {
          date:day, iso:schedISO(day),
          spans: lastD>d, spanStart: day.getTime()===d.getTime()
        }));
      }
    });
    return out.sort((a,b)=>a.date-b.date || String(a.start).localeCompare(String(b.start)));
  }catch(e){
    console.error("schedule unreadable:",e);
    return null;
  }
}

/* category -> a css class suffix; every badge also carries its text */
function catClass(c){
  const k=(c||"").toLowerCase();
  if(k.includes("game"))return "game";
  if(k.includes("practice"))return "prac";
  if(k.includes("travel"))return "trav";
  if(k.includes("off"))return "off";
  if(k.includes("fiba")||k.includes("international"))return "intl";
  return "other";
}
function fmtTime(ev){
  if(ev.allDay) return "All day";
  if(!ev.start) return "";
  return ev.end ? ev.start : ev.start;
}
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];


/* Same category palette the coaches' calendar uses: [background, text, border] */
const CAT_DEF={
  "Practice":["rgba(0,131,72,0.15)","#4ade80","rgba(0,131,72,0.3)"],
  "Game":["rgba(224,85,85,0.15)","#ff8a8a","rgba(224,85,85,0.3)"],
  "Travel":["rgba(251,191,36,0.12)","#fbbf24","rgba(251,191,36,0.25)"],
  "Off Day":["rgba(250,249,246,0.05)","rgba(250,249,246,0.4)","rgba(250,249,246,0.1)"],
  "International":["rgba(244,114,182,0.12)","#f472b6","rgba(244,114,182,0.25)"],
  "FIBA":["rgba(96,200,250,0.12)","#60c8fa","rgba(96,200,250,0.25)"],
  "Off Court":["rgba(52,211,153,0.12)","#34d399","rgba(52,211,153,0.25)"]
};
const CAT_FALLBACK=["rgba(250,249,246,0.06)","rgba(250,249,246,0.55)","rgba(250,249,246,0.12)"];
function catDef(c){ return CAT_DEF[c] || CAT_FALLBACK; }
function catStyle(c){
  const d=catDef(c);
  return `background:${d[0]};color:${d[1]};border-color:${d[2]}`;
}

let EVENTS=[], CURSOR=null, OFF=[], SEL=null;

function monthKey(d){return d.getFullYear()+"-"+d.getMonth();}
function shiftMonth(n){ CURSOR=new Date(CURSOR.getFullYear(),CURSOR.getMonth()+n,1); SEL=null; render(); }
function goToday(){ const t=schedToday(); CURSOR=new Date(t.getFullYear(),t.getMonth(),1); SEL=schedISO(t); render(); }

function activeCats(){
  return [...new Set(EVENTS.map(e=>e.cat||"Other"))].sort();
}
function toggleCat(c,el){
  const i=OFF.indexOf(c);
  if(i>=0) OFF.splice(i,1); else OFF.push(c);
  el.classList.toggle("on");
  render();
}
function shown(e){ return !OFF.includes(e.cat||"Other"); }

function buildFilters(){
  const box=document.getElementById("cat-filters");
  box.innerHTML=activeCats().map(c=>{
    const d=catDef(c);
    return `<span class="cat-pill on" style="background:${d[0]};color:${d[1]};border-color:${d[2]}"
             onclick="toggleCat('${c.replace(/'/g,"\\'")}',this)">${c}</span>`;
  }).join("");
}

function selectDay(iso){ SEL = (SEL===iso? null : iso); render(); }

function render(){
  const grid=document.getElementById("grid");
  const det=document.getElementById("detail");

  if(EVENTS===null){
    grid.innerHTML=`<div class="note">The schedule could not be loaded right now.<br>Please try again in a moment.</div>`;
    det.innerHTML=""; return;
  }
  if(!EVENTS.length){
    grid.innerHTML=`<div class="note">Nothing on the schedule is marked for players yet.<br>Your coaches will publish fixtures here.</div>`;
    det.innerHTML=""; return;
  }

  const y=CURSOR.getFullYear(), m=CURSOR.getMonth();
  document.getElementById("month-label").textContent=MONTHS[m]+" "+y;

  const today=schedToday();
  const first=new Date(y,m,1);
  const start=weekStart(first);                 /* Monday on or before the 1st */
  /* always whole weeks, or the grid loses a column */
  const last=new Date(y,m+1,0);
  const span=Math.round((last-start)/86400000)+1;
  const weeks=Math.ceil(span/7);
  const cells=[];
  for(let i=0;i<weeks*7;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    cells.push(d);
  }

  const head=`<div class="wd-row">${DAYS.map(d=>`<div class="wd">${d}</div>`).join("")}</div>`;

  grid.innerHTML = head + `<div class="month-wrap">` + cells.map(d=>{
    const iso=schedISO(d);
    const evs=EVENTS.filter(e=>e.iso===iso && shown(e));
    const cls=[
      "md",
      d.getMonth()!==m ? "other" : "",
      d.getTime()===today.getTime() ? "today" : "",
      evs.length ? "has" : "",
      SEL===iso ? "sel" : ""
    ].filter(Boolean).join(" ");
    const chips=evs.map(e=>{
      const label=(e.allDay||!e.start) ? e.title : e.start+" "+e.title;
      return `<div class="mev" style="${catStyle(e.cat)}" title="${e.title}">${label}</div>`;
    }).join("");
    const click = evs.length ? ` onclick="selectDay('${iso}')"` : "";
    return `<div class="${cls}"${click}><div class="md-num">${d.getDate()}</div>${chips}</div>`;
  }).join("") + `</div>`;

  /* detail panel: the selected day, or the month's next fixture if nothing picked */
  let panelDate = SEL;
  if(!panelDate){
    const inMonth=EVENTS.filter(e=>e.date.getFullYear()===y && e.date.getMonth()===m && shown(e));
    const next=inMonth.find(e=>e.date>=today) || inMonth[0];
    panelDate = next? next.iso : null;
  }
  if(!panelDate){ det.innerHTML=""; return; }

  const evs=EVENTS.filter(e=>e.iso===panelDate && shown(e));
  if(!evs.length){ det.innerHTML=""; return; }
  const d=evs[0].date;
  det.innerHTML=`<div class="detail">
    <div class="detail-h">${DAYS[(d.getDay()+6)%7]} ${d.getDate()} ${MONTHS[d.getMonth()]}${
      d.getTime()===today.getTime()?' <span style="color:var(--green)">· today</span>':""}</div>
    ${evs.map(e=>{
      const meta=[e.loc,e.notes].filter(Boolean).map(x=>`<span>${x}</span>`).join("");
      return `<div class="d-ev">
        <div class="d-time">${e.allDay?"All day":(e.start||"—")}</div>
        <div class="d-body">
          <div class="d-title">${e.title}<span class="d-tag" style="${catStyle(e.cat)}">${e.cat||"Event"}</span></div>
          ${meta?`<div class="d-meta">${meta}</div>`:""}
        </div>
      </div>`;
    }).join("")}
  </div>`;
}

(async function(){
  const p=new URLSearchParams(location.search).get("p");
  const back=document.getElementById("back");
  if(p){ back.href="/"+p.toLowerCase().trim(); back.textContent="\u2190 My portal"; }
  document.getElementById("tb-season").textContent="Schedule · "+SEASON;

  EVENTS=await loadSchedule();
  const today=schedToday();
  CURSOR=new Date(today.getFullYear(),today.getMonth(),1);

  if(EVENTS && EVENTS.length){
    const upcoming=EVENTS.filter(e=>e.date>=today).length;
    document.getElementById("sub").textContent=`Season ${SEASON} · ${EVENTS.length} sessions and fixtures · ${upcoming} still to come`;
    buildFilters();
  }else{
    document.getElementById("sub").textContent="";
  }
  render();
})();
</script>
</body>
</html>
